<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
  width: 100%;
  max-width: 350px;
}

.form {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form h2 {
  text-align: center;
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 15px;
}

.input-group label {
  display: block;
  margin-bottom: 5px;
  font-size: 14px;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #667eea;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #667eea;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #5a67d8;
}
.errorMessage {
    color: red;
    display: none;
}

.error {
    color: red;
    font-size: 12px;
    text-align: center;
    display: none;
}
</style>
<body>

  <div class="container">
    <form class="form">
      <h2>Login</h2>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" autocomplete="off" placeholder="Enter your email" >
        <small class="error" id="emailerror"></small>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Enter your password" >
        <small class="error" id="passerror"></small>
      </div>

      <button type="submit">Validate</button>
      <div class="errorMessage">
      </div>
    </form>
  </div>
<script src="scripts.js"></script>
</body>
</html>
